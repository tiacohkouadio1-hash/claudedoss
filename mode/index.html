<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{marque} — Créations & pièces de défilé</title>
  <meta name="description" content="Catalogue de créations : pièces de défilé et prototypes en exemplaire unique, prêt-à-porter à venir.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="accueil">
  <main>
    <section class="heros" id="heros" aria-label="Pièces à la une"></section>

    <section class="bloc">
      <div class="wrap deux-col">
        <div>
          <p class="caps sur-titre">La maison</p>
          <p class="manifeste" id="manifeste" style="margin-top:14px"></p>
        </div>
        <div>
          <p class="intro" id="presentation"></p>
          <p style="margin-top:26px"><a class="lien-fleche caps" href="maison.html">Découvrir la maison</a></p>
        </div>
      </div>
    </section>

    <section class="bloc fond-creme">
      <div class="wrap">
        <div class="entete-section">
          <div><p class="caps sur-titre">Les univers</p><h2 class="titre">Explorer</h2></div>
        </div>
        <div class="familles" id="familles"></div>
      </div>
    </section>

    <section class="bloc">
      <div class="wrap">
        <div class="entete-section">
          <div><p class="caps sur-titre">Sélection</p><h2 class="titre">Pièces disponibles</h2></div>
          <a class="lien-fleche caps" href="catalogue.html">Tout le catalogue</a>
        </div>
        <div class="grille" id="selection"></div>
      </div>
    </section>

    <section class="bloc fond-velours" id="bandeauPopup" hidden>
      <div class="wrap">
        <p class="caps sur-titre">Prochain pop-up store</p>
        <div class="contenu" style="margin-top:20px"></div>
        <p style="margin-top:24px"><a class="lien-fleche caps" href="pop-up.html">Toutes les dates</a></p>
      </div>
    </section>
  </main>
  <script src="data/catalogue.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
